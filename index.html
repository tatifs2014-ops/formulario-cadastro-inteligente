
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulário de Cadastro Inteligente</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="container">

        <h1>Criar conta</h1>

        <p>Campos com * são obrigatórios.</p>

        <form id="form-cadastro" novalidate>

            <div class="campo">
                <label for="nome">Nome completo <span class="obrigatorio">*</span></label>

                <input
                    type="text"
                    id="nome"
                    required
                    minlength="3"
                    placeholder="Digite seu nome completo"
                >

                <span class="mensagem-erro" id="erro-nome"></span>
            </div>

            <div class="campo">
                <label for="email">E-mail <span class="obrigatorio">*</span></label>

                <input
                    type="email"
                    id="email"
                    required
                    placeholder="exemplo@email.com"
                >

                <span class="mensagem-erro" id="erro-email"></span>
            </div>

            <div class="campo">
                <label for="cep">CEP <span class="obrigatorio">*</span></label>

                <input
                    type="text"
                    id="cep"
                    required
                    placeholder="00000-000"
                >

                <span class="mensagem-erro" id="erro-cep"></span>
            </div>

            <div class="campo">
                <label for="senha">Senha <span class="obrigatorio">*</span></label>

                <input
                    type="password"
                    id="senha"
                    required
                    minlength="8"
                    placeholder="Mínimo de 8 caracteres"
                >

                <span class="mensagem-erro" id="erro-senha"></span>

<span id="forca-senha"></span>

</div>

<div class="campo">
    <label for="confirma-senha">Confirmar Senha <span class="obrigatorio">*</span></label>

    <input type="password" id="confirma-senha" required placeholder="Digite a senha novamente">
                
                
                

                <span class="mensagem-erro" id="erro-confirma-senha"></span>
            </div>

            <button type="submit">
                Finalizar Cadastro
            </button>

        </form>

        <p id="mensagem-sucesso" aria-live="polite"></p>

    </main>

    <script type="module" src="./dist/main.js"></script>

</body>
</html>
